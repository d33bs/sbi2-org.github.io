<!DOCTYPE html>

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>SBI2 2026 Boston Conference - Links</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Society of Biomolecular Imaging & Informatics (SBI²) 2026 Boston conference links page.">

    <!-- Keywords -->
    <meta name="keywords" content="biology, microscropy, imaging, informatics, research, industry, science">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://sbi2-org.github.io">

    <!-- Author Information -->
    <meta name="author" content="Society of Biomolecular Imaging & Informatics (SBI²)">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--soft" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink">

            <!-- Replace with your name or brand -->
            <h1>
              <div>SBI² 2026 Boston</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Welcome to SBI² 2026! Join us November 2&ndash;4 at the Renaissance Boston Seaport District. Use the links below to navigate conference information.</p>

            <div class="button-stack" role="navigation">

              <a id="conference-program" class="button button-gitlab" href="https://drive.google.com/file/d/1-R4rrgW-3Aoy8yLFBgwo5iCzzs_zohhE/view?usp=sharing" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="Document Icon">Conference program</a>

              <a class="button button-fiverr" href="https://maps.app.goo.gl/UgzD5F2ddY68nkqu5" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-map.svg" alt="Map Icon">Venue directions</a>

              <a class="button button-bluesky" href="https://drive.google.com/file/d/1WQ49QNq25ScnX7ce6-OybpNVh7q1D1Bf/view?usp=drive_link" rel="noreferrer noopener" role="button" target="_blank"><img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="Blog Icon">Conference at a glance</a>

              <a id="poster-abstracts" class="button button-mailchimp" href="https://www.jotform.com/form/261656868015162" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-review.svg" alt="Review Icon">Poster abstracts</a>

              <a class="button button-linked" href="https://www.linkedin.com/company/society-of-biomolecular-imaging-and-informatics" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">Follow us on LinkedIn</a>

              
      </div>

      <script>
        // Hide the poster abstracts button after the submission deadline
        // (Oct 5, 2026, end of day, conference local time: America/New_York).
        (function () {
          var deadline = new Date('2026-10-06T00:00:00-04:00'); // 00:00 EDT = Oct 5 23:59
          var btn = document.getElementById('poster-abstracts');
          if (btn && new Date() >= deadline) {
            btn.remove();
          }
        })();
      </script>
      <footer>
         Brought to you by SBI².
    </div>
  </div>

</body>

</html>
